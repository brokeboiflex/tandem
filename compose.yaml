# Tandem: one service, one container. Every vendor program of every person runs in a sandbox of its
# own inside it (crun: the person's uid, its own PID/network/mount namespaces, a read-only system, no
# capabilities), so any Docker host works: no KVM, no Docker socket, no container per person.
# Dokploy: create a Compose service (type Docker Compose) from this repository and attach your domain
# to port 8787 (README, Deploying on Dokploy). A second instance on the same host needs its own project name and volume.
services:
  tandem:
    build: .
    image: ${TANDEM_IMAGE:-tandem:0.3.0}
    env_file: .env
    # What creating the sandboxes needs, and nothing more: namespaces, mounts and each person's cgroup
    # (SYS_ADMIN), each sandbox's loopback (NET_ADMIN), and no AppArmor profile, whose Docker default
    # forbids mounts. Docker's default seccomp filter stays on for the container, and every sandbox
    # gets Docker's filter for unprivileged containers on top (src/security.ts).
    cap_add: [SYS_ADMIN, NET_ADMIN]
    security_opt: ["apparmor=unconfined"]
    # Every person's home, their uids and the gateway's sockets. On a server shared with other apps,
    # also cap the whole container (mem_limit): RUNTIME_MEMORY_MB limits each person, not everyone.
    volumes: ["tandem-data:/var/lib/tandem"]
    # Local use: the API on this machine only. Behind Dokploy's proxy the domain routes to port 8787
    # over Dokploy's network instead.
    ports: ["127.0.0.1:${GATEWAY_PORT:-8787}:8787"]
    # An init reaps processes; on stop the gateway stops every sandbox (TERM, then KILL) first.
    init: true
    stop_grace_period: 60s
    restart: unless-stopped
volumes:
  tandem-data:
