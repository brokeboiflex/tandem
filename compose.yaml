# Local stack: the gateway only. It creates one runtime container per person on demand.
# Build the runtime image first: docker buildx build --load -t tandem-runtime:2026.11.6-preview.7 runtime
name: tandem
services:
  gateway:
    build: .
    image: tandem-gateway:0.1.0
    container_name: tandem-gateway
    env_file: .env
    environment:
      BIND_HOST: 0.0.0.0
      PORT: "8787"
      RUNTIME_NETWORK: tandem-runtimes
    ports: ["127.0.0.1:${GATEWAY_PORT:-8787}:8787"]
    networks: [runtimes]
    # Local development talks to the Engine socket directly, which is root-equivalent. In
    # production, put a restricted socket proxy in front and set RUNTIME_DOCKER_HOST=tcp://... (README).
    volumes: ["/var/run/docker.sock:/var/run/docker.sock"]
    user: root
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:8787/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
networks:
  # Runtimes and the gateway only. Runtimes need Internet egress to reach the vendors.
  runtimes:
    name: tandem-runtimes
