# Tandem: one service, one container. Every person's runtime is a microVM inside it (KVM), so the
# host needs /dev/kvm and nothing else: no Docker socket, no sibling containers. Dokploy: create a
# Compose service from this repository and attach your domain to port 8787 (README, Deploying on
# Dokploy). A second instance on the same host needs its own project name and volume.
services:
  tandem:
    build: .
    image: ${TANDEM_IMAGE:-tandem:0.2.0}
    env_file: .env
    # KVM for the microVMs. Docker's default seccomp profile and capabilities are enough.
    devices: ["/dev/kvm:/dev/kvm"]
    # microsandbox's state, every person's home, the runtime image cache and the MCP sockets.
    volumes: ["tandem-data:/var/lib/tandem"]
    # Local use: the API on this machine only. Behind Dokploy's proxy, remove `ports` and route the
    # domain to port 8787 instead.
    ports: ["127.0.0.1:${GATEWAY_PORT:-8787}:8787"]
    # An init reaps the microVM processes; on stop the gateway shuts every running microVM down
    # gracefully before the container exits.
    init: true
    stop_grace_period: 60s
    restart: unless-stopped
volumes:
  tandem-data:
