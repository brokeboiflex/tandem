# Optional: the gateway reaches Docker only through Sockguard (https://github.com/CodesWhat/sockguard),
# a filtering Docker API proxy, over a Unix socket on a private volume (no network at all). The policy
# is deploy/sockguard.yaml.
#   docker compose -f compose.yaml -f compose.socket-proxy.yaml up -d
# The gateway may then only manage containers, volumes and networks carrying Tandem's ownership
# label (${RUNTIME_PREFIX}.home=1, which every person volume has always had); it cannot see or touch
# other containers, run privileged containers, add capabilities, use host namespaces or devices,
# mount host paths, or exec as root. Relaxing a runtime setting (RUNTIME_USER, RUNTIME_CAP_ADD,
# RUNTIME_NO_NEW_PRIVILEGES, RUNTIME_MEMORY_MB/PIDS = 0, another RUNTIME_OCI_RUNTIME) needs the
# matching change in deploy/sockguard.yaml. Requires Docker Compose 2.24.4 or later.
services:
  gateway:
    user: bun
    volumes: !override ["docker-api:/var/run/tandem-docker:ro"]
    environment:
      RUNTIME_DOCKER_HOST: unix:///var/run/tandem-docker/docker.sock
    labels: ["${RUNTIME_PREFIX:-tandem}.home=1"]
    depends_on: [egress, docker-proxy]
  egress:
    labels: ["${RUNTIME_PREFIX:-tandem}.home=1"]
  docker-proxy:
    # Multi-arch index digest of 2.4.6 (linux/amd64 and linux/arm64).
    image: codeswhat/sockguard:2.4.6@sha256:9a7142d9f8254e7fde7543e046eff920463f5df27b36d959915b44fb4878d06f
    container_name: ${RUNTIME_PREFIX:-tandem}-docker-proxy
    command: ["serve", "--config", "/etc/sockguard/sockguard.yaml"]
    environment:
      # The instance-specific parts of deploy/sockguard.yaml.
      SOCKGUARD_OWNERSHIP_LABEL_KEY: ${RUNTIME_PREFIX:-tandem}.home
      SOCKGUARD_REQUEST_BODY_CONTAINER_CREATE_ALLOWED_IMAGES: ${RUNTIME_IMAGE:-docker.io/library/tandem-runtime:2026.11.6-preview.7}
    volumes:
      - "./deploy/sockguard.yaml:/etc/sockguard/sockguard.yaml:ro"
      - "${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock:ro"
      - "docker-api:/var/run/tandem-docker"
    # UID 0 only to open the Engine socket (owned by root on most hosts), without any capability;
    # GID 1000 (the gateway's group) owns the filtered socket. Where the Engine socket belongs to
    # another user, add its group: DOCKER_SOCKET_GID=$(stat -c %g /var/run/docker.sock).
    user: "0:1000"
    group_add: ["${DOCKER_SOCKET_GID:-0}"]
    network_mode: none
    read_only: true
    # Request bodies (container archives) are spooled here for inspection.
    tmpfs: ["/tmp:size=64m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    pids_limit: 256
    restart: unless-stopped
volumes:
  docker-api:
    name: ${RUNTIME_PREFIX:-tandem}-docker-api
