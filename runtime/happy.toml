# Machine-wide Happy Agent configuration for ONE person's runtime (standalone, not team mode).
# The entrypoint installs this file at ~/happy/config/happy.toml on every start, so the gateway
# owns this policy; the person's state lives on the named volume.

[settings]
# Happy syncs to its relay/mobile app by default. Off: the gateway is the only client.
happy_integration = false

# Unattended start: satisfies the profile part of onboarding without a profile API call.
[profile]
name = "Tandem user"
email = "user@tandem.invalid"

[feature.team]
enabled = false

# No Internet exposure of the API, and no phone pairing socket.
[feature.tailcat]
enabled = false

[feature.mobile_connector]
enabled = false

# Only the person's own vendor accounts: signed in through the vendors' own CLIs, or the person's
# own API key.
[providers]
default_enable = false

# `executable` names the official Claude Code binary installed in this image (see the harness note
# below). With no credentials named here the account is the person's own `claude auth login`; the
# entrypoint adds `api_key` below when the person chose their own Anthropic API key instead.
[providers.claude]
enabled = true
executable = "/usr/local/bin/claude"

[providers.codex]
enabled = true

# The person's own `grok login --device-auth`, which Happy reads from ~/.grok/auth.json. No Happy
# sub-agents on Grok or OpenRouter: both run on Happy's own loop, whose sub-agent routes are chosen
# per account, so a Grok conversation could otherwise start OpenRouter work and the reverse.
[providers.grok]
enabled = true
include_subagent_models = []

# OpenRouter with the person's own API key. The entrypoint adds the credential: the key the gateway
# wrote to the person's volume as `api_key`, or without one an `api_key_env` that nothing sets
# (Happy requires one of the two), so the account has no credential. Only chat models that support
# tool calling; Happy reads their names, context windows and efforts from OpenRouter's /models.
[providers.openrouter]
type = "openai_compatible"
enabled = true
base_url = "https://openrouter.ai/api/v1"
models = [
  "anthropic/claude-sonnet-5.5",
  "openai/gpt-6.2-sol",
  "google/gemini-4-carbon",
  "x-ai/grok-4.7",
  "deepseek/deepseek-v4.1-flash-1017",
  "qwen/qwen4-max",
  "moonshotai/kimi-k3.1-pro",
  "z-ai/glm-5.3-prime",
]
reasoning_field = "reasoning"
include_subagent_models = []

[providers.openrouter.request]
reasoning = { enabled = true }

# Happy's own agent loop runs only Grok and OpenRouter, which have no agent of their own; every
# other account runs its vendor's unmodified agent. It starts no sub-agents on other harnesses.
[harnesses.happy]
providers = ["grok", "openrouter"]
subagent_harnesses = []

# What a new agent gets when a message names nothing. The gateway always sends an explicit mode.
[defaults]
provider = "claude"
model = "claude-code/default"
permission_mode = "auto"

# Claude Code itself, through the Claude Agent SDK bundled in the Happy Agent binary. Note: in this
# version the harness always runs that bundled copy; `executable` above is not honored by it.
# No sub-agents on other harnesses: a Claude conversation must not start Codex work.
[harnesses.claude_code]
providers = ["claude"]
subagent_harnesses = []

# Codex itself, through `codex app-server` (the pinned /usr/local/bin/codex on PATH).
[harnesses.codex_cli]
providers = ["codex"]
subagent_harnesses = []
