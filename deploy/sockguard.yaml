# Sockguard policy for the Tandem gateway (compose.socket-proxy.yaml). Default deny: the gateway may
# only manage what carries Tandem's ownership label, which compose.socket-proxy.yaml sets through
# SOCKGUARD_OWNERSHIP_LABEL_KEY=<RUNTIME_PREFIX>.home (every person volume has always carried it).
# Sockguard stamps that label on every container, volume and network the gateway creates and hides
# or refuses everything else, so the paths below need no name patterns.
listen:
  socket: /var/run/tandem-docker/docker.sock
  # Group 1000 is the gateway image's `bun` user.
  socket_mode: "0660"
  socket_gid: 1000
upstream:
  socket: /var/run/docker.sock
log:
  level: info
  format: json
  access_log: true
response:
  # The gateway reads its own address on each runtime network.
  redact_network_topology: false
ownership:
  owner: "1"
  allow_unowned_images: true
request_body:
  container_create:
    allow_privileged: false
    allow_host_network: false
    allow_host_pid: false
    allow_host_ipc: false
    allow_host_userns: false
    allow_host_cgroupns: false
    restrict_namespace_sharing: true
    allowed_bind_mounts: []
    allow_all_devices: false
    allow_device_requests: false
    allow_all_capabilities: false
    allowed_capabilities: []
    require_drop_all_capabilities: true
    require_no_new_privileges: true
    require_non_root_user: true
    require_memory_limit: true
    require_pids_limit: true
    deny_unconfined_seccomp: true
    deny_unconfined_apparmor: true
    deny_selinux_disable: true
    deny_unconfined_system_paths: true
    allow_sysctls: false
    # Plus the Engine default (no runtime named). Add others (kata-runtime) here if you use them.
    allowed_runtimes: ["runsc"]
  exec:
    allow_privileged: false
    allow_root_user: false
    # The gateway's only commands inside a runtime (src/runtime.ts, src/gateway.ts and the sign-outs
    # in src/happy.ts).
    allowed_commands:
      - ["cat", "/home/agent/.happy/agent/token"]
      - ["rm", "-f", "/home/agent/.agent-runtime/anthropic-api-key"]
      - ["sh", "-c", 'claude auth logout >/dev/null 2>&1; rm -f "$HOME/.claude/.credentials.json" "/home/agent/.agent-runtime/anthropic-api-key"']
      - ["sh", "-c", 'codex logout >/dev/null 2>&1; rm -f "$HOME/.codex/auth.json"']
      - ["sh", "-c", 'grok logout >/dev/null 2>&1; rm -f "$HOME/.grok/"auth.json*']
      - ["rm", "-f", "/home/agent/.agent-runtime/openrouter-api-key"]
      # MCP registrations, conversation titles and standing instructions (src/gateway.ts).
      - ["cat", "/home/agent/.agent-runtime/mcp-servers.json"]
      - ["cat", "/home/agent/.agent-runtime/titles.json"]
      - ["cat", "/home/agent/.agent-runtime/instructions.md"]
      - ["rm", "-f", "/home/agent/.agent-runtime/instructions.md", "/home/agent/projects/chats/AGENTS.md", "/home/agent/projects/chats/CLAUDE.md"]
      # Read-only (src/runtime.ts): the addresses a running runtime was created with for the gateway
      # and the egress proxy (this proxy redacts container environments), and whether the daemon of a
      # runtime the gateway cannot reach is still working (the token goes to curl on standard input).
      - ["sh", "-c", 'echo "$HAPPY_BRIDGE_ALLOW" "$MCP_PROXY_URL" "$HTTPS_PROXY"']
      # Claude Code's model names (src/runtime.ts CLAUDE_MODELS_COMMAND): an initialize request, no turn.
      - ["sh", "-c", 'cd /tmp && echo ''{"type":"control_request","request_id":"models","request":{"subtype":"initialize"}}'' | timeout 20 claude -p --input-format stream-json --output-format stream-json --verbose 2>/dev/null | grep -m 1 ''"control_response"''']
      - ["sh", "-c", 't=$(cat /home/agent/.happy/agent/token) && for p in projects/chats provider-clis/claude provider-clis/codex provider-clis/grok; do echo "authorization: Bearer $t" | curl -sf -m 10 -H @- --unix-socket /home/agent/.happy/agent/server.sock "http://runtime/v0/$p" && echo || exit 1; done']
  container_archive:
    # The gateway's private folder, and AGENTS.md/CLAUDE.md in the chat workspace (instructions).
    allowed_paths: ["/home/agent/.agent-runtime", "/home/agent/projects/chats"]
  network:
    # Runtime networks are created in isolated gateway mode (no host address on the bridge).
    allow_driver_options: true
    endpoint_config:
      # The gateway and the egress proxy join each runtime network at fixed addresses (README,
      # Operations). MAC pinning, links and endpoint driver options stay refused.
      allow_static_addressing: true
rules:
  - { match: { method: GET, path: "/_ping" }, action: allow }
  - { match: { method: GET, path: "/version" }, action: allow }
  - { match: { method: GET, path: "/info" }, action: allow }
  # Image inspect by name (a/b/c:tag has up to three segments); never the image list.
  - { match: { method: GET, path: "/images/*/json" }, action: allow }
  - { match: { method: GET, path: "/images/*/*/json" }, action: allow }
  - { match: { method: GET, path: "/images/*/*/*/json" }, action: allow }
  - { match: { method: GET, path: "/containers/json" }, action: allow }
  - { match: { method: GET, path: "/containers/*/json" }, action: allow }
  - { match: { method: POST, path: "/containers/create" }, action: allow }
  - { match: { method: POST, path: "/containers/*/start" }, action: allow }
  - { match: { method: POST, path: "/containers/*/stop" }, action: allow }
  - { match: { method: POST, path: "/containers/*/restart" }, action: allow }
  - { match: { method: DELETE, path: "/containers/*" }, action: allow }
  - { match: { method: POST, path: "/containers/*/exec" }, action: allow }
  - { match: { method: POST, path: "/exec/*/start" }, action: allow }
  - { match: { method: GET, path: "/exec/*/json" }, action: allow }
  - { match: { method: PUT, path: "/containers/*/archive" }, action: allow }
  - { match: { method: GET, path: "/volumes/*" }, action: allow }
  - { match: { method: POST, path: "/volumes/create" }, action: allow }
  - { match: { method: GET, path: "/networks" }, action: allow }
  - { match: { method: GET, path: "/networks/*" }, action: allow }
  - { match: { method: POST, path: "/networks/create" }, action: allow }
  - { match: { method: POST, path: "/networks/*/connect" }, action: allow }
  - { match: { method: POST, path: "/networks/*/disconnect" }, action: allow }
  - { match: { method: DELETE, path: "/networks/*" }, action: allow }
  - { match: { method: "*", path: "/**" }, action: deny }
